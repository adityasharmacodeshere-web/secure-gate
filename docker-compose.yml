services:
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/securegate.db
      CORS_ORIGINS: http://localhost:4173
      HIBP_API_URL: https://api.pwnedpasswords.com/range
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-in-development}
    ports: ["8000:8000"]
    volumes: [securegate-data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports: ["4173:4173"]
volumes:
  securegate-data:
